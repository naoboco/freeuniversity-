<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAO Engineering OS — Programme Ingénieur Électronique & Mécanique</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #1c2330;
  --border: #2d3646;
  --text: #e6e9ef;
  --muted: #8b95a7;
  --accent: #4fc3f7;
  --accent2: #ffb74d;
  --green: #66bb6a;
  --purple: #b39ddb;
  --coral: #ff8a65;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  padding-bottom: 60px;
}
header {
  padding: 28px 20px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: sticky; top: 0; z-index: 10;
}
.header-inner { max-width: 1000px; margin: 0 auto; }
h1 { font-size: 20px; font-weight: 600; letter-spacing: .3px; }
h1 span { color: var(--accent); }
.subtitle { font-size: 13px; color: var(--muted); margin-top: 2px; }
.global-progress { margin-top: 14px; }
.gp-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.gp-track { height: 8px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
.gp-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--purple)); border-radius: 99px; transition: width .4s ease; }

.container { max-width: 1000px; margin: 0 auto; padding: 20px; }

.tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.tab {
  padding: 8px 18px; border-radius: 99px; font-size: 13px; cursor: pointer;
  background: var(--surface); border: 1px solid var(--border); color: var(--muted);
  transition: all .15s; user-select: none;
}
.tab:hover { border-color: var(--accent); }
.tab.active { background: var(--accent); color: #0d1117; font-weight: 600; border-color: var(--accent); }
.tab .badge { font-size: 11px; opacity: .8; margin-left: 4px; }

.phase { display: none; animation: fadein .25s ease; }
.phase.active { display: block; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px);} to { opacity:1; transform:none;} }

.phase-intro {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 20px; margin-bottom: 18px;
}
.phase-intro .pi-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pi-badge { font-size: 11px; font-weight: 600; padding: 3px 12px; border-radius: 99px; }
.pi-title { font-size: 16px; font-weight: 600; }
.pi-dur { font-size: 12px; color: var(--muted); margin-left: auto; }
.jarvis {
  font-size: 13px; color: var(--muted); font-style: italic; margin-top: 8px;
  border-left: 2px solid var(--accent); padding-left: 12px;
}

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 18px; transition: border-color .15s;
}
.card:hover { border-color: #3d4a5f; }
.card.done { border-color: var(--green); }
.card.done .c-title { text-decoration: line-through; opacity: .6; }
.c-head { display: flex; align-items: flex-start; gap: 10px; }
.c-check {
  width: 22px; height: 22px; min-width: 22px; border-radius: 6px; border: 2px solid var(--border);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all .15s; font-size: 14px; color: transparent; margin-top: 2px;
}
.c-check:hover { border-color: var(--green); }
.card.done .c-check { background: var(--green); border-color: var(--green); color: #0d1117; }
.c-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--accent2); margin-bottom: 2px; }
.c-title { font-size: 14px; font-weight: 600; }
.c-desc { font-size: 12px; color: var(--muted); margin: 8px 0 10px; }
.res { list-style: none; }
.res li { margin-bottom: 6px; display: flex; align-items: baseline; gap: 6px; }
.res a { font-size: 12px; color: var(--accent); text-decoration: none; }
.res a:hover { text-decoration: underline; }
.tag { font-size: 10px; font-weight: 600; padding: 1px 8px; border-radius: 99px; white-space: nowrap; }
.tag-yt { background: rgba(255,138,101,.15); color: var(--coral); }
.tag-uni { background: rgba(102,187,106,.15); color: var(--green); }
.tag-book { background: rgba(179,157,219,.15); color: var(--purple); }
.tag-tool { background: rgba(79,195,247,.15); color: var(--accent); }

.tip {
  background: var(--surface2); border-radius: 8px; padding: 10px 14px; margin-top: 10px;
  font-size: 12px; color: var(--muted); border-left: 2px solid var(--accent2);
}
.warning {
  background: rgba(255,183,77,.08); border: 1px solid rgba(255,183,77,.3);
  border-radius: var(--radius); padding: 14px 18px; margin-top: 18px; font-size: 13px; color: var(--accent2);
}
.reset-btn {
  margin-top: 24px; padding: 8px 18px; border-radius: 99px; font-size: 12px; cursor: pointer;
  background: transparent; border: 1px solid var(--border); color: var(--muted); transition: all .15s;
}
.reset-btn:hover { border-color: var(--coral); color: var(--coral); }
footer { text-align: center; font-size: 11px; color: var(--muted); margin-top: 30px; }
</style>
</head>

  {
    id: "p3", tab: "Phase 3 — Systèmes", badge: "Systèmes intégrés", badgeColor: "#66bb6a",
    title: "Contrôle, Énergie, Fabrication & Embarqué", dur: "10–12 mois",
    jarvis: "Vous entrez dans la zone où électroniciens et mécaniciens se disputent. Réponse : le mécatronicien a toujours raison. Vous, donc. Bientôt.",

    subjects: [

        desc: "Boucles fermées, stabilité, PID, Bode. Faire obéir les systèmes.",
        res: [

        ]},
      { label: "Systèmes embarqués", title: "Arduino, Raspberry Pi, RTOS",
        desc: "Programmer du matériel physique. Capteurs, actionneurs, temps réel.",
        res: [
          ["yt","YouTube","DroneBot Workshop – Arduino & Pi","https://www.youtube.com/@Dronebotworkshop"],
          ["uni","MIT OCW","Microcomputer Project Lab","https://ocw.mit.edu/courses/6-115-microcomputer-project-laboratory-spring-2012/"],
          ["yt","YouTube","Phil's Lab – STM32 & PCB design","https://www.youtube.com/@PhilsLab"]
        ]},
      { label: "Électrotechnique", title: "Convertisseurs, moteurs & énergie",
        desc: "Transformateurs, moteurs AC/DC, DC-DC. Le pont vers la puissance réelle.",
        res: [
          ["uni","MIT OCW","Electric Machines","https://ocw.mit.edu/courses/6-685-electric-machines-fall-2013/"],
          ["yt","YouTube","Sam Ben-Yaakov – Power Electronics","https://www.youtube.com/@sambenyaakov"]
        ]},
      { label: "Thermodynamique & Fluides", title: "Échangeurs, cycles thermiques",
        desc: "Chaleur, entropie, dynamique des fluides. Ce qui chauffe, refroidit et circule.",
        res: [
          ["uni","MIT OCW","Thermodynamics & Kinetics","https://ocw.mit.edu/courses/5-60-thermodynamics-kinetics-spring-2008/"],

        res: [

          ["yt","YouTube","NYC CNC – usinage","https://www.youtube.com/@nyccnc"],

          ["tool","Outil","Code_Aster – FEM open-source","https://code-aster.org/"],

  {

    jarvis: "Les théories sans projet ne sont que du bruit, Madame. Construisez quelque chose qui fonctionne — ou qui explose de manière instructive.",

        desc: "Mécanique + électronique + logiciel = robot. C'est ici que tout converge.",

        ]},

const TAGS = { yt: "tag-yt", uni: "tag-uni", book: "tag-book", tool: "tag-tool" };
let progress = {};
try { progress = JSON.parse(localStorage.getItem("nao-eng-progress") || "{}"); } catch(e) { progress = {}; }

function save() { localStorage.setItem("nao-eng-progress", JSON.stringify(progress)); }

function totalSubjects() { return DATA.reduce((n,p) => n + p.subjects.length, 0); }
function doneCount() { return Object.values(progress).filter(Boolean).length; }

function updateGlobal() {
  const pct = Math.round(doneCount() / totalSubjects() * 100);
  document.getElementById("gp-fill").style.width = pct + "%";
  document.getElementById("gp-text").textContent = pct + "% (" + doneCount() + "/" + totalSubjects() + " modules)";
  DATA.forEach((p, i) => {
    const done = p.subjects.filter((s, j) => progress[p.id + "-" + j]).length;
    document.getElementById("badge-" + p.id).textContent = done + "/" + p.subjects.length;
  });
}

function toggle(key, el) {
  progress[key] = !progress[key];
  el.classList.toggle("done", progress[key]);
  save();
  updateGlobal();
}

function resetAll() {
  if (!confirm("Réinitialiser toute la progression ? J.A.R.V.I.S. désapprouve, mais c'est votre choix.")) return;
  progress = {};
  save();
  document.querySelectorAll(".card").forEach(c => c.classList.remove("done"));
  updateGlobal();
}

function switchTab(id) {
  document.querySelectorAll(".phase").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.getElementById("tab-" + id).classList.add("active");
}

// Render
const tabsEl = document.getElementById("tabs");
const phasesEl = document.getElementById("phases");

DATA.forEach((p, i) => {
  const tab = document.createElement("div");
  tab.className = "tab" + (i === 0 ? " active" : "");
  tab.id = "tab-" + p.id;
  tab.innerHTML = p.tab + ' <span class="badge" id="badge-' + p.id + '"></span>';
  tab.onclick = () => switchTab(p.id);
  tabsEl.appendChild(tab);

  const phase = document.createElement("div");
  phase.className = "phase" + (i === 0 ? " active" : "");
  phase.id = p.id;

  let cards = "";
  p.subjects.forEach((s, j) => {
    const key = p.id + "-" + j;
    const isDone = progress[key] ? " done" : "";
    let links = "";
    s.res.forEach(r => {
      links += '<li><span class="tag ' + TAGS[r[0]] + '">' + r[1] + '</span><a href="' + r[3] + '" target="_blank" rel="noopener">' + r[2] + '</a></li>';
    });
    cards += '<div class="card' + isDone + '" id="card-' + key + '">' +
      '<div class="c-head">' +
      '<div class="c-check" onclick="toggle(\'' + key + '\', document.getElementById(\'card-' + key + '\'))">✓</div>' +
      '<div><div class="c-label">' + s.label + '</div><div class="c-title">' + s.title + '</div></div>' +
      '</div>' +
      '<div class="c-desc">' + s.desc + '</div>' +
      '<ul class="res">' + links + '</ul>' +
      '</div>';
  });

  phase.innerHTML =
    '<div class="phase-intro">' +
    '<div class="pi-top">' +
    '<span class="pi-badge" style="background:' + p.badgeColor + '22;color:' + p.badgeColor + '">' + p.badge + '</span>' +
    '<span class="pi-title">' + p.title + '</span>' +
    '<span class="pi-dur">' + p.dur + '</span>' +
    '</div>' +
    '<div class="jarvis">' + p.jarvis + '</div>' +
    '</div>' +
    '<div class="grid">' + cards + '</div>' +
    '<div class="tip">💡 ' + p.tip + '</div>';

  phasesEl.appendChild(phase);
});

updateGlobal();
</script>
